<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HGU-EATS | 한동대 맛집 지도</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main-header">
      <h1><i class="fa-solid fa-utensils"></i> HGU-EATS</h1>
      <p>한동인들을 위한 실시간 맛집 지도</p>
    </header>

    <main class="container">
      <section class="filter-section map-box">
        <h2><i class="fa-solid fa-map-location-dot"></i> 1. 지역 선택</h2>

        <div class="map-wrapper">
          <img src="약도.png" alt="한동대 주변 맛집 약도" class="responsive-map" />

          <a
            href="restaurants.html#handong-zone"
            target="food-frame"
            title="한동대"
            style="
              position: absolute;
              top: 3.42%;
              left: 39.63%;
              width: 15.62%;
              padding-top: 15.62%;
              border-radius: 50%;
              z-index: 20;
            "
          ></a>
          <a
            href="restaurants.html#court-zone"
            target="food-frame"
            title="법원"
            style="
              position: absolute;
              top: 33.79%;
              left: 42.91%;
              width: 6.25%;
              padding-top: 6.25%;
              border-radius: 50%;
              z-index: 20;
            "
          ></a>
          <a
            href="restaurants.html#jangseong-zone"
            target="food-frame"
            title="장성/장량"
            style="
              position: absolute;
              top: 50.83%;
              left: 27.76%;
              width: 15.62%;
              padding-top: 15.62%;
              border-radius: 50%;
              z-index: 20;
            "
          ></a>
          <a
            href="restaurants.html#yangdeok-zone"
            target="food-frame"
            title="양덕"
            style="
              position: absolute;
              top: 49.16%;
              left: 59.63%;
              width: 13.54%;
              padding-top: 13.54%;
              border-radius: 50%;
              z-index: 20;
            "
          ></a>
          <a
            href="restaurants.html#yeongildai-zone"
            target="food-frame"
            title="영일대"
            style="
              position: absolute;
              top: 76.01%;
              left: 61.56%;
              width: 8.33%;
              padding-top: 8.33%;
              border-radius: 50%;
              z-index: 20;
            "
          ></a>
        </div>

        <div class="location-buttons">
          <a href="restaurants.html#all-zone" target="food-frame" class="btn-link">전체보기</a>
          <a href="restaurants.html#handong-zone" target="food-frame" class="btn-link">한동대</a>
          <a href="restaurants.html#yangdeok-zone" target="food-frame" class="btn-link">양덕</a>
          <a href="restaurants.html#jangseong-zone" target="food-frame" class="btn-link">장성/장량</a>
          <a href="restaurants.html#court-zone" target="food-frame" class="btn-link">법원</a>
          <a href="restaurants.html#yeongildai-zone" target="food-frame" class="btn-link">영일대</a>
        </div>
      </section>

      <section class="filter-section category-box">
        <h2><i class="fa-solid fa-tags"></i> 2. 카테고리 선택</h2>
        <div class="category-buttons">
          <a href="restaurants.html#family-zone" target="food-frame" class="btn-link">가족과</a>
          <a href="restaurants.html#honbab" target="food-frame" class="btn-link">혼밥</a>
          <a href="restaurants.html#couple-zone" target="food-frame" class="btn-link">연인과</a>
          <a href="restaurants.html#tour-zone" target="food-frame" class="btn-link">관광</a>
          <a href="restaurants.html#cafe-zone" target="food-frame" class="btn-link">카페</a>
        </div>
      </section>

      <section class="result-section">
        <h2><i class="fa-solid fa-list-check"></i> 3. 추천 맛집</h2>
        <iframe
          src="restaurants.html"
          name="food-frame"
          class="embed-food-window"
          title="식당 리스트"
          id="food-iframe"
        ></iframe>
      </section>
    </main>
  </body>
</html>
